<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/contact.css') }}"
    />
  </head>
  <body>
    <!-- Top Half -->
    <section class="contact-header">
      <div class="logo">
        <a href="{{ url_for('home') }}"
          ><img
            src="{{ url_for('static', filename='images/Routetrax_white_png.png') }}"
            alt="Logo"
        /></a>
      </div>

      <h2>
        Got any questions? You may find the answers in our
        <a href="#" class="help-link">help centre.</a>
      </h2>
    </section>

    <!-- Bottom Half -->
    <section class="contact-section">
      <div class="popup-container" id="popupContainer">
        <div class="popup-content">
          <button class="close-btn" id="closePopup">Close</button>
          <div class="popup-info">
            <!-- Popup content goes here -->
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="contact-container">
        <a class="contact-box" id="social">
          <div class="contact-icon">
            <i class="fas fa-comment-alt"></i>
          </div>
          <h3>Socials</h3>
        </a>

        <a class="contact-box" id="contactus">
          <div class="contact-icon">
            <i class="fas fa-phone-alt"></i>
          </div>
          <h3>Contact Us</h3>
        </a>

        <a class="contact-box" id="driverdetails">
          <div class="contact-icon">
            <i class="fas fa-id-card"></i>
          </div>
          <h3>Driver Details</h3>
        </a>
      </div>
    </section>

    <script>
      const contact1 = document.getElementById("social");
      const contact2 = document.getElementById("contactus");
      const contact3 = document.getElementById("driverdetails");
      const popupContainer = document.getElementById("popupContainer");
      const closePopupButton = document.getElementById("closePopup");

      function showPopup(content) {
        const popupInfo = document.querySelector(".popup-info");
        popupInfo.innerHTML = content;
        popupContainer.style.display = "flex";
      }

      const socialMediaHTML = `
            <div class="social-media-card">
                <h2>Follow Us on Social Media</h2>
                <div class="social-icons">
                    <a href="https://www.instagram.com/yourcollege" class="social-icon" target="_blank">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.youtube.com/c/yourcollege" class="social-icon" target="_blank">
                        <i class="fab fa-youtube"></i>
                    </a>
                    <a href="https://www.facebook.com/yourcollege" class="social-icon" target="_blank">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://www.linkedin.com/school/yourcollege" class="social-icon" target="_blank">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://twitter.com/yourcollege" class="social-icon" target="_blank">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="https://www.snapchat.com/add/yourcollege" class="social-icon" target="_blank">
                        <i class="fab fa-snapchat-ghost"></i>
                    </a>
                    <a href="https://www.tiktok.com/@yourcollege" class="social-icon" target="_blank">
                        <i class="fab fa-tiktok"></i>
                    </a>
                </div>
            </div>
        `;

      contact1.addEventListener("click", () => {
        showPopup(socialMediaHTML);
      });

      contact2.addEventListener("click", () => {
        showPopup(
          "<h2>Contact Info</h2><p>Email: contact@yourcollege.com<br>Phone: +123 456 7890</p>"
        );
      });

      contact3.addEventListener("click", () => {
        showPopup(
          "<h2>Driver Details</h2><p>For driver information, please contact support.</p>"
        );
      });

      closePopupButton.addEventListener("click", () => {
        popupContainer.style.display = "none";
      });
    </script>
  </body>
</html>
