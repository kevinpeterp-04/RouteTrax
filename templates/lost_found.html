<!DOCTYPE html>
<html>
  <head>
    <title>Lost & Found</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h2>Lost & Found</h2>

      <!-- Report Lost Item -->
      <div class="card mb-4">
        <div class="card-header">
          <h4>Report Lost Item</h4>
        </div>
        <div class="card-body">
          <form id="reportForm">
            <div class="mb-3">
              <label class="form-label">Item Name</label>
              <input type="text" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Location Lost</label>
              <input type="text" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary">Submit Report</button>
          </form>
        </div>
      </div>

      <!-- Lost Items List -->
      <div class="card">
        <div class="card-header">
          <h4>Recently Found Items</h4>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Description</th>
                  <th>Location Found</th>
                  <th>Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {% for item in lost_items %}
                <tr>
                  <td>{{ item.name }}</td>
                  <td>{{ item.description }}</td>
                  <td>{{ item.location }}</td>
                  <td>{{ item.date }}</td>
                  <td>
                    <span
                      class="badge bg-{{ 'success' if item.claimed else 'warning' }}"
                    >
                      {{ 'Claimed' if item.claimed else 'Unclaimed' }}
                    </span>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("reportForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          // Add Firebase submission logic here
          alert("Report submitted successfully!");
        });
    </script>
  </body>
</html>
