<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROUTETRAX</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      #map {
        height: 500px;
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin: 2rem 0;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="{{ url_for('home') }}">
          <img
            src="{{ url_for('static', filename='images/Routetrax_white_png.png') }}"
            alt="Logo"
          />
        </a>
      </div>
      <nav class="navbar">
        <ul>
          <li><a href="{{ url_for('home') }}">HOME</a></li>
          <li><a href="#">NOTIFICATIONS</a></li>
          <li><a href="{{ url_for('map') }}">MAP</a></li>
          <li><a href="#">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <div class="main-content">
      <div class="hero">
        <div id="map"></div>
      </div>
    </div>

    <footer>
      <p>
        &copy; 2025 RouteTrax. All Rights Reserved
        <a href="#">TERMS AND CONDITIONS</a>
        <a href="#">PRIVACY POLICY</a>
      </p>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        var map = L.map("map").setView([12.9716, 77.5946], 15);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);

        var busMarker = L.marker([12.9716, 77.5946])
          .addTo(map)
          .bindPopup("Your College Bus Location")
          .openPopup();

        function updateBusLocation() {
          fetch("/bus-location")
            .then((response) => response.json())
            .then((data) => {
              if (data.latitude && data.longitude) {
                busMarker
                  .setLatLng([data.latitude, data.longitude])
                  .bindPopup("Updated Bus Location")
                  .openPopup();
                map.setView([data.latitude, data.longitude], 15);
              }
            })
            .catch((error) =>
              console.error("Error fetching bus location:", error)
            );
        }

        setInterval(updateBusLocation, 5000);
      });
    </script>
  </body>
</html>
