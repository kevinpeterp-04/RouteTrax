<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="static/css/login2.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
  </head>
  <body>
    <div class="login-container">
      <h1>Log in<span class="red">.</span></h1>
      <p class="signup-text">
        Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
      </p>

      <form onsubmit="return loginUser(event)">
        <label for="email">Enter Email</label>
        <input type="email" id="email" required />

        <label for="password">Enter Password</label>
        <input type="password" id="password" required />

        <div class="divider">
          <hr />
          <span>OR</span>
          <hr />
        </div>

        <button class="social-btn">Continue with Microsoft Account</button>
        <button class="social-btn">Continue with Google</button>

        <div class="button-group">
          <button
            type="button"
            class="small-btn"
            onclick="window.location.href='index.html'"
          >
            Go Back
          </button>
          <button type="submit" class="small-btn confirm">Confirm</button>
        </div>
      </form>
    </div>

    <script>
      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyAYeyrhjBlujXAY58k5hZXo5j9fa_h5bmM",
        authDomain: "routetrax-5e817.firebaseapp.com",
        databaseURL: "https://routetrax-5e817-default-rtdb.firebaseio.com",
        projectId: "routetrax-5e817",
        storageBucket: "routetrax-5e817.firebasestorage.app",
        messagingSenderId: "891824394529",
        appId: "1:891824394529:web:b4c6ee464b895b91946e60",
      };

      // ✅ Initialize Firebase
      const app = firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      // ✅ Login Function
      function loginUser(event) {
        event.preventDefault(); // Prevent page reload

        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;

        auth
          .signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            alert("✅ Login Successful!");
            console.log("User logged in:", userCredential.user);

            // ✅ Ensure redirection happens properly
            setTimeout(() => {
              window.location.href = "/home";
            }, 1000);
          })
          .catch((error) => {
            console.error("Login failed:", error.message);
            alert("❌ Login Failed: " + error.message);
          });
      }
    </script>
  </body>
</html>
