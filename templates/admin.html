<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link

    />
    <link

    />

    <div class="center-wrapper">

          View Map
        </button>
        <button
          type="button"

          onclick="window.location.href='{{ url_for('notifadmin') }}';"

        <button

          onclick="window.location.href='{{ url_for('admincomplaint') }}';"
        >
          View Complaints
        </button>
        <button
          onclick="window.location.href='{{ url_for('adminlost') }}';"
