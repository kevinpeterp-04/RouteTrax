<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteTrax - Live Bus Tracking</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div id="map" style="height: 500px; width: 100%"></div>

    <script>
      function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 15,
          center: { lat: 12.9716, lng: 77.5946 }, // Default location (Change later)
        });

        const marker = new google.maps.Marker({
          position: { lat: 12.9716, lng: 77.5946 }, // Default location (Change dynamically)
          map: map,
          title: "Bus Location",
        });

        // Function to update marker position
        function updateBusLocation(lat, lng) {
          marker.setPosition({ lat: lat, lng: lng });
          map.setCenter({ lat: lat, lng: lng });
        }

        // Fetch bus location from Flask backend every 5 seconds
        function fetchBusLocation() {
          fetch("/bus-location")
            .then((response) => response.json())
            .then((data) => {
              updateBusLocation(data.lat, data.lng);
            })
            .catch((error) => console.error("Error fetching location:", error));
        }

        setInterval(fetchBusLocation, 5000); // Refresh every 5 seconds
      }
    </script>

    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap"
    ></script>
  </body>
</html>
