<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint Registration</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/complaints.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <button class="back-button" onclick="location.href='{{ url_for('home') }}'">
      ◀
    </button>

    <div class="main-content">
      <h1 class="title">Complaint Registration</h1>

      <div class="complaint-container">
        <form id="complaintForm" class="complaint-form">
          <div class="form-group">
            <select id="busNumber" required>
              <option value="">Select Bus Number</option>
              {% for bus in ["20", "21", "22", "23"] %}
              <option value="{{ bus }}">{{ bus }}</option>
              {% endfor %}
            </select>

            <select id="category" required>
              <option value="">Select Category</option>
              <option value="late">Late Arrival</option>
              <option value="overcrowding">Overcrowding</option>
              <option value="behavior">Driver Behavior</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <textarea
              id="description"
              placeholder="Detailed Complaint Description"
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Submit Complaint</button>
        </form>

        <div class="complaint-history">
          <h2>Complaint History</h2>
          <div id="complaintsList" class="complaints-list">
            <!-- Complaints will be loaded dynamically -->
          </div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="{{ url_for('static', filename='js/complaints.js') }}"
    ></script>
  </body>
</html>
